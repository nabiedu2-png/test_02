<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비밀 정원 도감 : Secret Oasis</title>
    <!-- FontAwesome for beautiful icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Custom Botanical CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- 헤더 영역 -->
        <header class="app-header">
            <h1 class="header-title">
                <i class="fa-solid fa-leaf"></i> 비밀 정원 도감
            </h1>
            <p class="header-subtitle">도심의 소음을 피해 숨겨진 고요한 초록 쉼터를 찾아서</p>
        </header>

        <!-- 반경 및 태그 제어 패널 -->
        <section class="controls-panel">
            <div class="radius-slider-container">
                <span class="radius-label">
                    <i class="fa-solid fa-compass"></i> 탐색 반경
                </span>
                <div class="slider-wrapper">
                    <input type="range" class="radius-slider" id="radiusSlider" min="500" max="2000" step="500" value="1000">
                </div>
                <span class="radius-value" id="radiusValue">1.0km</span>
            </div>

            <div class="tag-filters" id="tagFilters">
                <!-- Javascript에서 태그 버튼들을 동적으로 생성하거나 관리합니다. -->
                <button class="tag-btn active" data-tag="조용한">
                    <i class="fa-solid fa-volume-xmark"></i> 조용한
                </button>
                <button class="tag-btn" data-tag="그늘이 많은">
                    <i class="fa-solid fa-cloud-sun"></i> 그늘이 많은
                </button>
                <button class="tag-btn" data-tag="벤치가 있는">
                    <i class="fa-solid fa-chair"></i> 벤치가 있는
                </button>
                <button class="tag-btn" data-tag="사람이 적은">
                    <i class="fa-solid fa-user-slash"></i> 사람이 적은
                </button>
                <button class="tag-btn" data-tag="물소리가 들리는">
                    <i class="fa-solid fa-water"></i> 물소리가 들리는
                </button>
                <button class="tag-btn" data-tag="반려동물 가능">
                    <i class="fa-solid fa-paw"></i> 반려동물 가능
                </button>
            </div>
        </section>

        <!-- 인터랙션 지도 영역 -->
        <section class="map-section">
            <div id="map"></div>
            <!-- GPS 상태 표시 레이어 -->
            <div class="map-status-overlay" id="mapStatus">
                <span>
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">위치 신호 탐색 중...</span>
                </span>
                <span id="locationSimText" style="color: var(--color-terracotta); font-weight: bold;">(시뮬레이션 모드)</span>
            </div>
            <!-- 현위치 돌아가기 버튼 -->
            <button class="recenter-btn" id="recenterBtn" title="현위치로 돌아가기">
                <i class="fa-solid fa-location-crosshairs"></i>
            </button>
        </section>

        <!-- 비밀 정원 리스트 영역 -->
        <section class="list-section">
            <div class="list-header">
                <span class="list-count" id="listCount">주변 정원 목록</span>
                <button class="sort-selector" id="sortBtn">
                    <i class="fa-solid fa-arrow-down-wide-narrow"></i> <span id="sortLabel">고요함 점수 순</span>
                </button>
            </div>

            <!-- 정원 카드들이 들어갈 컨테이너 -->
            <div id="parksList" style="display: flex; flex-direction: column; gap: 16px;">
                <!-- JS에서 카드들을 렌더링합니다. -->
            </div>
        </section>

        <!-- 길안내 오버레이 화면 (Navigation Screen) -->
        <div class="nav-overlay" id="navOverlay">
            <header class="nav-header">
                <button class="back-btn" id="navBackBtn">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="nav-title-container">
                    <h2 class="nav-destination-name" id="navDestName">이끼 정원</h2>
                    <p class="nav-destination-desc" id="navDestDesc">동네 한구석의 한적한 쉼터</p>
                </div>
            </header>

            <!-- 길안내 전용 지도 -->
            <div class="nav-map-container">
                <div id="nav-map"></div>
            </div>

            <!-- 길안내 상세정보 및 타임라인 -->
            <div class="nav-content">
                <div class="nav-summary-box">
                    <div class="summary-item">
                        <div class="summary-value" id="navSummaryTime">10<span class="summary-unit">분</span></div>
                        <div class="summary-label">예상 소요 시간</div>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-item">
                        <div class="summary-value" id="navSummaryDistance">650<span class="summary-unit">m</span></div>
                        <div class="summary-label">남은 거리</div>
                    </div>
                </div>

                <div>
                    <h3 class="nav-steps-title">
                        <i class="fa-solid fa-shoe-prints" style="transform: rotate(-45deg);"></i> 도보 길안내 시나리오
                    </h3>
                    <div class="nav-timeline" id="navTimeline">
                        <!-- 길안내 단계들이 동적으로 들어갑니다. -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 알림 토스트 메시지 -->
        <div class="toast-msg" id="toastMsg">
            <i class="fa-solid fa-circle-info"></i>
            <span id="toastText">메시지 내용</span>
        </div>

        <!-- 정원 제보 바텀 시트 오버레이 -->
        <div class="bottom-sheet-overlay" id="bottomSheetOverlay"></div>

        <!-- 정원 제보 바텀 시트 -->
        <div class="bottom-sheet" id="bottomSheet">
            <div class="bottom-sheet-header">
                <div class="bottom-sheet-handle"></div>
                <div class="bottom-sheet-title-container">
                    <h2 class="bottom-sheet-title"><i class="fa-solid fa-seedling"></i> 새로운 비밀 정원 제보</h2>
                    <p class="bottom-sheet-subtitle">내가 아는 조용하고 아늑한 초록 쉼터를 함께 공유해 주세요.</p>
                </div>
                <button class="close-sheet-btn" id="closeSheetBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form class="bottom-sheet-content" id="addGardenForm" autocomplete="off">
                <!-- 위도/경도는 hidden 필드로 처리 -->
                <input type="hidden" id="gardenCoords" required>

                <div class="form-group">
                    <label for="gardenName" class="form-label">정원 이름</label>
                    <input type="text" id="gardenName" class="form-input" placeholder="예: 소담한 단풍나무 쉼터" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">고요함 / 한적함 점수</label>
                    <div class="rating-stars" id="ratingStars">
                        <button type="button" class="star-btn active" data-value="1"><i class="fa-solid fa-star"></i></button>
                        <button type="button" class="star-btn active" data-value="2"><i class="fa-solid fa-star"></i></button>
                        <button type="button" class="star-btn active" data-value="3"><i class="fa-solid fa-star"></i></button>
                        <button type="button" class="star-btn active" data-value="4"><i class="fa-solid fa-star"></i></button>
                        <button type="button" class="star-btn active" data-value="5"><i class="fa-solid fa-star"></i></button>
                    </div>
                    <input type="hidden" id="gardenRating" value="5">
                </div>

                <div class="form-group">
                    <label class="form-label">선호 태그 선택 (다중 선택)</label>
                    <div class="form-tag-chips" id="formTagChips">
                        <button type="button" class="form-tag-chip" data-tag="조용한">#조용한</button>
                        <button type="button" class="form-tag-chip" data-tag="사람이 적은">#사람이 적은</button>
                        <button type="button" class="form-tag-chip" data-tag="벤치가 있는">#벤치가 있는</button>
                        <button type="button" class="form-tag-chip" data-tag="그늘이 많은">#그늘이 많은</button>
                        <button type="button" class="form-tag-chip" data-tag="물소리가 들리는">#물소리가 들리는</button>
                        <button type="button" class="form-tag-chip" data-tag="반려견 가능">#반려견 가능</button>
                        <button type="button" class="form-tag-chip" data-tag="산책로">#산책로</button>
                        <button type="button" class="form-tag-chip" data-tag="밤에 예쁜">#밤에 예쁜</button>
                        <button type="button" class="form-tag-chip" data-tag="뷰가 좋은">#뷰가 좋은</button>
                        <button type="button" class="form-tag-chip" data-tag="잔디밭">#잔디밭</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="gardenComment" class="form-label">추천 한마디 (선택)</label>
                    <textarea id="gardenComment" class="form-textarea" placeholder="이 정원의 특별한 점을 들려주세요 (예: 철마다 다른 야생화가 가득 피어나요)"></textarea>
                </div>
                
                <button type="submit" class="submit-sheet-btn" id="submitSheetBtn">
                    <i class="fa-solid fa-check"></i> 정원 등록하기
                </button>
            </form>
        </div>

    </div>

    <!-- Leaflet.js Map script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- App entry script -->
    <script type="module" src="app.js"></script>
</body>
</html>
